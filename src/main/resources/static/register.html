<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Cadastro</title>
    <link rel="shortcut icon" href="images/icon.svg" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <script src="js/register.js" defer></script>
</head>

<body>
    <nav id="navbar">
        <img src="images/icon.svg" alt="Spotify" id="icon-nav">
        <p>Spotify - Trabalho Final Programação Web</p>
    </nav>

    <main class="main">
        <section class="register-container">

            <img src="images/icon.svg" alt="Spotify" id="logo-register" />

            <h1 class="register-title">
                Cadastre-se<br> para começar<br> a ouvir.
            </h1>

            <form class="register-form">
                <div>
                    <label for="username">Nome</label>
                    <input id="name" type="text" />
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input id="email" type="text" />
                </div>

                <div>
                    <label for="password">Senha</label>
                    <input id="password" type="password" />
                </div>

                <button type="submit" class="btn-register">
                    Cadastrar
                </button>
            </form>
        </section>
    </main>
</body>

</html>
